name: Build & release firmware

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, espos]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: read pinned IDF version
        id: idf
        run: echo "version=$(cat .idf-version)" >> "$GITHUB_OUTPUT"

      # espOS web UI → LittleFS "storage" image (served by the device at /)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: espos/ui

      # A throwaway signing key is generated by CMake when none is present;
      # release builds must instead restore the project's real key from a
      # secret (see espos/docs/ota.md) — devices only accept images signed
      # with the key whose public part they were flashed with.
      - name: restore signing key (releases)
        if: github.event_name == 'release' && env.KEY != ''
        env:
          KEY: ${{ secrets.COCKPIT_SIGNING_KEY_PEM }}
        run: printf '%s' "$KEY" > secure_boot_signing_key.pem

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32p4
          command: idf.py build

      - name: Merge flash images into one binary
        run: |
          pip install "esptool==4.8.1"
          python scripts/merge_firmware.py --build-dir build --chip esp32p4 --out cockpit-merged.bin

      - name: Verify merged binary
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          data = Path("cockpit-merged.bin").read_bytes()
          print(f"{len(data)} bytes ({len(data)/1024/1024:.2f} MiB)")
          if data[0x2000] != 0xE9:
              sys.exit(f"error: no ESP image magic at 0x2000 (got {data[0x2000]:#04x})")
          print("merged image looks structurally sound")
          PY

      - name: Upload build artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: merged-firmware
          path: |
            cockpit-merged.bin
            build/cockpit.bin

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: merged-firmware
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cockpit-merged.bin
            build/cockpit.bin
